[package]
name = "luau-academy"
version = "0.1.0"
description = "Luau Academy learning application"
authors = ["Luau Academy contributors"]
edition = "2021"

[lib]
name = "luau_academy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
